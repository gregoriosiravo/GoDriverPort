name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # global.json (8.0.100, rollForward latestFeature) selects among the installed 8.0 SDKs.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build app -c Release

      # Tests that need real AMD/Lenovo packages or the real signing tools are skipped when their LGO_* variables are unset.
      - name: Test
        run: dotnet test app -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
