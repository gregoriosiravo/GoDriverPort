name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out (full history, for the branch check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A release must come from main: the tagged commit has to be reachable from origin/main.
      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME points to $env:GITHUB_SHA, which is not on origin/main. Releases must be tagged on main." }
          exit 0

      # The release build uses exactly this SDK, because it determines the .NET runtime that the self-contained exe embeds
      # (8.0.428 bundles runtime 8.0.34, which app/tools/tools.lock.json and fetch-tools.ps1 pin). To update: change this version,
      # DotnetVersion in app/tools/fetch-tools.ps1, and re-provision with -Force -AcceptChangedTools.
      - name: Set up .NET SDK (exact version)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.428'

      - name: Pin the SDK for this build
        shell: pwsh
        run: |
          # Local, uncommitted override of global.json (contributors keep rollForward latestFeature).
          Set-Content -LiteralPath global.json -Value '{ "sdk": { "version": "8.0.428", "rollForward": "disable" } }'
          dotnet --version
          if ((dotnet --version) -ne '8.0.428') { throw 'The .NET SDK in use is not 8.0.428.' }
          exit 0

      - name: Read version and check the tag
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content -LiteralPath Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' in Directory.Build.props is not x.y.z" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match Directory.Build.props version v$v"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$v"

      # fetch-tools.ps1 copies the .NET runtime licence files from the NuGet cache, so the win-x64 runtime packs must be restored first.
      - name: Restore win-x64 runtime packs
        shell: pwsh
        run: |
          dotnet restore app/src/LegionGoConverter.App -r win-x64 -p:SelfContained=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed ($LASTEXITCODE)" }
          exit 0

      # The helper tools are downloaded from their official locations and checked against pinned SHA-256 values here, then
      # app/tools/fetch-tools.ps1 compares the extracted files with the committed app/tools/tools.lock.json and stops on any
      # difference. Nothing from Microsoft is downloaded or shipped: the app uses the Windows SDK the user installs.
      - name: Provision app/tools
        shell: pwsh
        run: |
          function Get-Verified([string]$Uri, [string]$OutFile, [string]$Sha256) {
            Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing
            $got = (Get-FileHash -LiteralPath $OutFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $Sha256) { throw "SHA-256 of $Uri is $got, expected $Sha256" }
          }
          $tmp = Join-Path $env:RUNNER_TEMP 'tools-dl'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          # innoextract 1.9 (zip)
          Get-Verified 'https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip' "$tmp\innoextract.zip" '6989342c9b026a00a72a38f23b62a8e6a22cc5de69805cf47d68ac2fec993065'
          Expand-Archive -LiteralPath "$tmp\innoextract.zip" -DestinationPath "$tmp\innoextract"
          if (-not (Test-Path "$tmp\innoextract\innoextract.exe")) { throw 'innoextract.exe not at the root of the zip.' }
          # 7-Zip 26.06 (installer, unpacked with the runner's 7-Zip)
          Get-Verified 'https://www.7-zip.org/a/7z2606-x64.exe' "$tmp\7z-setup.exe" '9b697f65ecc2d9b0152f5ee96d72dde522a7827690349d9307935dacf40f42ec'
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          & $sevenZip x -y "-o$tmp\7zip" "$tmp\7z-setup.exe" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed ($LASTEXITCODE)" }
          foreach ($f in '7z.exe', '7z.dll', 'License.txt') { if (-not (Test-Path "$tmp\7zip\$f")) { throw "$f not found after unpacking the 7-Zip installer." } }
          ./app/tools/fetch-tools.ps1 -SevenZipDir "$tmp\7zip" -InnoExtractDir "$tmp\innoextract"
          exit 0

      # Chocolatey version pin: 6.7.3 (the version this was compile-tested with) is not on Chocolatey; 6.7.1 is the newest version of
      # the 'innosetup' package that could be found. This exact combination has not been run yet: do a manual dry run first.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          exit 0

      # Runs the tests, publishes one build (no Microsoft SDK files; used for both the installer and the portable zip),
      # builds the zip, compiles the installer, writes SHA256SUMS.txt.
      - name: Build, test, package
        shell: pwsh
        run: ./build.ps1 -SkipTools -Zip -Installer

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    # Only for a pushed v* tag; a manual run just keeps the artifacts above.
    # Owner: protect the v* tags in the repository settings (and optionally add an `environment:` with required reviewers here).
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out (release notes template)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist

      - name: Verify hashes
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          sed -e "s|{{VERSION}}|${VERSION}|g" -e "s|{{TAG}}|${TAG}|g" -e "s|{{REPO}}|${REPO}|g" \
            .github/release-notes-template.md > release-notes.md
          # 0.x releases are marked as pre-releases.
          PRE=""
          case "$VERSION" in 0.*) PRE="--prerelease" ;; esac
          gh release create "$TAG" \
            "dist/LegionGoDriverPort-${VERSION}-Setup.exe" \
            "dist/LegionGoDriverPort-${VERSION}-portable.zip" \
            "dist/SHA256SUMS.txt" \
            --title "Legion Go Driver Port ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            $PRE
